name: Diagnose ARM64 Candidate
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: "Run ID containing the already-built candidate"
        required: true
        type: string
      enable_ksu:
        description: "Select the KernelSU candidate"
        default: false
        type: boolean
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          name: arm64-candidate-ksu-${{ inputs.enable_ksu }}
          path: ${{ runner.temp }}/candidate
      - name: Check and extract the existing candidate
        run: |
          cd "$RUNNER_TEMP/candidate"
          shasum -a 256 -c arm64-candidate.tar.gz.sha256
          mkdir -p "$RUNNER_TEMP/avdlite"
          tar -xzf arm64-candidate.tar.gz -C "$RUNNER_TEMP/avdlite"
          rm arm64-candidate.tar.gz
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" emulator platform-tools
      - name: Bounded kernel and ADB diagnosis
        run: python3 -m avdlite.smoke --manifest "$RUNNER_TEMP/avdlite/manifest.json" --work "$RUNNER_TEMP/avdlite" --sdk "$ANDROID_HOME" --accel off --boot-timeout 90 --cold-boot-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: arm64-diagnostic
          path: |
            ${{ runner.temp }}/avdlite/verification.json
            ${{ runner.temp }}/avdlite/evidence/
